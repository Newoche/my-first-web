<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador de Servicios Rápido</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="cotizador-container">
        <h1>Calculadora de Cotizaciones</h1>
        <p class="subtitle">Calcula un estimado rápido para tu servicio técnico o web.</p>

        <form id="quote-form">
            <!-- Selección de Servicio -->
            <div class="form-group">
                <label for="service-type">Selecciona el tipo de servicio:</label>
                <select id="service-type" required>
                    <option value="" disabled selected>Elige una opción...</option>
                    <option value="50">Mantenimiento Preventivo   ($50)</option>
                    <option value="120">Instalación de Sistema   ($90)</option>
                    <option value="80">Diagnóstico y Reparación   ($30)</option>
                </select>
            </div>

            <!-- Cantidad de unidades u horas -->
            <div class="form-group">
                <label for="units">Cantidad de unidades / horas:</label>
                <input type="number" id="units" min="1" value="1" required>
            </div>

            <!-- Opciones extra -->
            <div class="form-group checkbox-group">
                <input type="checkbox" id="express">
                <label for="express">Servicio de Urgencia / Express (+$30)</label>
            </div>

            <button type="submit" class="btn-calcular">Calcular Cotización</button>
        </form>

        <!-- Resultado -->
        <div id="result-box" class="result-hidden">
            <h3>Estimado Total:</h3>
            <p id="total-price">$0.00</p>
        </div>
        <div>
            <button type="button" class="clear-btn" id="btn-clear">Limpiar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
